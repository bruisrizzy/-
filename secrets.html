<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>secrets.</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #111111; --fg: #f5f5f5; }
    }
    :root[data-theme="dark"] { --bg: #111111; --fg: #f5f5f5; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      flex-direction: column;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: "Times New Roman", Times, serif;
    }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0; text-align: center; }
    h1 { cursor: pointer; user-select: none; }
    .found { margin: 1rem 0 0; font-size: 1.25rem; text-align: center; min-height: 1.5em; }
    .endings { margin: 1rem 0 0; font-size: 1.25rem; text-align: center; }
  </style>
</head>
<body>
  <h1 id="title">secrets.</h1>
  <p class="endings" id="endings">?/? Endings</p>
  <p class="found" id="found"></p>
  <script>
    // Change this to wherever you want the page to send people after 5 seconds.
    var REDIRECT_URL = "https://www.google.com";

    document.getElementById("title").addEventListener("click", function () {
      document.getElementById("found").textContent = "You found 1 ending";
      document.getElementById("endings").textContent = "1/? Endings";
    });

    setTimeout(function () {
      window.location.href = REDIRECT_URL;
    }, 5000);
  </script>
</body>
</html>
